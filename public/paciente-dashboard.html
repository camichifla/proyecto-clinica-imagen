<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal Paciente</title>
    <link rel="stylesheet" href="/clinica-imagen/public/css/styles.css">
    <link rel="stylesheet" href="/clinica-imagen/public/css/agenda.css">
    <script src="/clinica-imagen/public/scripts/global.js" defer></script>
    <script src="/clinica-imagen/public/scripts/paciente-dashboard.js" defer></script>
    <script src="/clinica-imagen/public/scripts/paciente-agenda.js" defer></script>
</head>
<body>
    <header class="main-header shadow">
        <div class="container header-flex">
            <div class="logo"><a href="/clinica-imagen/public/index.html"><img src="/clinica-imagen/public/images/logo.png" alt="Clínica Imagen"></a><span class="badge-portal">Portal Paciente</span></div>
            <nav class="main-nav"><span id="userGreeting">Hola, paciente</span><a href="/clinica-imagen/api/logout.php" class="btn-logout">Cerrar Sesión</a><button id="agendaToggle" class="btn-primary" type="button">Solicitar Estudio</button></nav>
        </div>
    </header>
    <main class="container dashboard-layout">
        <aside class="sidebar-referencia" aria-label="Orden médica activa"><div class="card-odontologo" id="ordenActiva"><p>Cargando información...</p></div></aside>
        <section class="main-panel">
            <div class="panel-section"><h2>Mis Citas Programadas</h2><div class="table-responsive" id="citasTable"><p>Cargando citas...</p></div></div>
            <div class="panel-section"><h2>Mis Estudios Ejecutados</h2><div class="grid-estudios" id="estudiosList"><p class="text-muted">Cargando estudios...</p></div></div>
        </section>
    </main>
    <div id="agendaModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="agendaTitle">
        <div class="modal-content agenda-modal-content">
            <div class="agenda-header"><div><h2 id="agendaTitle">Solicitar Estudio</h2></div></div>
            <form id="agendaForm" class="agenda-form">
                <div class="form-group"><label for="selectEstudio">Estudio</label><select id="selectEstudio" name="estudio" required><option value="">Elige un estudio</option><option value="Tomografía Dental">Tomografía Dental</option><option value="Rayos X Panorámico">Rayos X Panorámico</option><option value="Resonancia Magnética Facial">Resonancia Magnética Facial</option></select></div>
                <div class="agenda-error-text" id="agendaError"></div><div class="agenda-success-text" id="agendaSuccess" role="status" aria-live="polite"></div><div class="agenda-actions"><button type="submit" class="btn-primary">Enviar Solicitud</button><button id="agendaCancel" type="button" class="btn-danger">Cancelar</button><button id="agendaClose" type="button" class="btn-small outline">Cerrar</button></div>
            </form>
        </div>
    </div>
    <div id="cancelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cancelTitle">
        <div class="modal-content agenda-modal-content">
            <h2 id="cancelTitle">Cancelar solicitud</h2>
            <form id="patientCancelForm" class="agenda-form">
                <input id="cancelCitaId" type="hidden">
                <div class="form-group"><label for="patientCancelReason">Motivo de cancelacion</label><textarea id="patientCancelReason" rows="4" maxlength="500" required></textarea></div>
                <div class="agenda-error-text" id="cancelError"></div>
                <div class="agenda-actions"><button type="submit" class="btn-danger">Confirmar cancelacion</button><button id="cancelClose" type="button" class="btn-small outline">Volver</button></div>
            </form>
        </div>
    </div>
    <footer></footer>
</body>
</html>
