# /etc/ssh/sshd_config.d/clinica.conf — SSH hardening for Clinica Imagen.

# Root cannot log in over SSH; use a normal user + sudo.
PermitRootLogin no

# Fewer guesses per connection, and a short window to authenticate.
MaxAuthTries 3
LoginGraceTime 30

# No graphical forwarding, no empty passwords.
X11Forwarding no
PermitEmptyPasswords no

# Drop dead sessions after 2 missed keepalives (about 10 minutes idle).
ClientAliveInterval 300
ClientAliveCountMax 2

# Optional: only allow members of this group. Left disabled so the operator is not locked out;
# first run `groupadd ssh-clinica && usermod -aG ssh-clinica <usuario>`, then uncomment.
#AllowGroups ssh-clinica

# Password login stays enabled for now. Switch to "no" once SSH keys are set up (ssh-copy-id).
PasswordAuthentication yes
