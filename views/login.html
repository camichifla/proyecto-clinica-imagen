<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Clínica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/tema.js"></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clínica Imagen"></a>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-auth">
      <h1>Iniciar sesión</h1>

      <p class="campo-error" data-aviso="expirado" hidden>Tu sesión expiró por inactividad. Iniciá sesión nuevamente.</p>
      <p class="aviso-exito" data-aviso="verificado" hidden>Cuenta verificada. Ya podés iniciar sesión.</p>
      <p class="campo-error" data-general hidden></p>
      <p data-aviso="reenviar" hidden><a href="verify.html">Reenviar enlace de verificación</a></p>

      <form method="post" action="api/login.php" data-api="api/login.php" novalidate>
        <input type="hidden" name="csrf" value="">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <p><a href="reset-request.html">¿Olvidaste tu contraseña?</a></p>
      <p>¿No tenés cuenta? <a href="register.html">Registrate</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; Clínica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" data-modo="publico" defer></script>
  <script src="assets/js/campos.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</body>

</html>
