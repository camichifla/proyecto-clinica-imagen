<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnos - Clinica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/backoffice.css">
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clinica Imagen"></a>
    </div>
    <div class="user">
      <details class="menu-usuario">
        <summary class="menu-usuario-toggle" aria-label="Menu de usuario">
          <span class="avatar" aria-hidden="true"></span>
        </summary>
        <div class="menu-usuario-panel">
          <span class="user-nombre"></span>
          <ul class="menu-usuario-lista"></ul>
          <form method="post" action="logout.php" class="form-logout">
            <input type="hidden" name="csrf" value="">
            <button type="submit" class="btn-logout">Cerrar sesion</button>
          </form>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-panel">
      <div class="barra-turnos">
        <h1>Turnos</h1>
        <button type="button" class="btn-secundario" id="btn-imprimir">Imprimir reporte</button>
      </div>

      <p class="aviso-exito" data-mensaje role="status" hidden></p>
      <p class="aviso-error" data-mensaje-error role="alert" hidden></p>

      <form class="filtros-turnos" id="filtros-turnos" novalidate>
        <div class="campo">
          <label for="filtro-desde">Desde</label>
          <input type="date" id="filtro-desde" name="desde">
        </div>
        <div class="campo">
          <label for="filtro-hasta">Hasta</label>
          <input type="date" id="filtro-hasta" name="hasta">
        </div>
        <div class="campo">
          <label for="filtro-sucursal">Sede</label>
          <select id="filtro-sucursal" name="sucursal_id">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-estado">Estado</label>
          <select id="filtro-estado" name="estado">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="rechazada">Rechazada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-codigo">Codigo</label>
          <input type="text" id="filtro-codigo" name="codigo" placeholder="CI-000123" autocomplete="off">
        </div>
        <button type="submit" class="btn-primary">Filtrar</button>
      </form>

      <ul class="totales-turnos" id="turnos-totales" aria-label="Totales por estado"></ul>
      <p class="campo-hint" id="turnos-truncado" hidden>Se muestran las primeras 500 citas. Acota el rango de fechas para ver el resto.</p>

      <div id="turnos-lista"></div>
    </section>
  </main>

  <footer>
    <nav aria-label="Pie de pagina">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <p>&copy; Clinica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
  <script src="assets/js/turnos.js" defer></script>
</body>

</html>
