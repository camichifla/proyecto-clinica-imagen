<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnos - Clínica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/backoffice.css">
  <script src="./assets/js/tema.js"></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clínica Imagen"></a>
    </div>
    <div class="user">
      <details class="menu-usuario">
        <summary class="menu-usuario-toggle" aria-label="Menú de usuario">
          <span class="avatar" aria-hidden="true"></span>
        </summary>
        <div class="menu-usuario-panel">
          <span class="user-nombre"></span>
          <ul class="menu-usuario-lista"></ul>
          <form method="post" action="logout.php" class="form-logout">
            <input type="hidden" name="csrf" value="">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
          </form>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-panel">
      <h1>Turnos</h1>

      <p class="aviso-exito" data-mensaje role="status" hidden></p>
      <p class="aviso-error" data-mensaje-error role="alert" hidden></p>

      <button type="button" class="btn-secundario" id="btn-nueva-cita" aria-expanded="false" aria-controls="form-nueva-cita">Nueva cita</button>
      <form class="filtros-turnos" id="form-nueva-cita" novalidate hidden>
        <div class="campo">
          <label for="nueva-paciente">Paciente</label>
          <select class="selector-combo" id="nueva-paciente" name="paciente_id" data-buscable></select>
        </div>
        <div class="campo">
          <label for="nueva-sucursal">Sede</label>
          <select class="selector-combo" id="nueva-sucursal" name="sucursal_id"></select>
        </div>
        <div class="campo">
          <label for="nueva-estudio">Estudio</label>
          <select class="selector-combo" id="nueva-estudio" name="estudio"></select>
        </div>
        <div class="campo">
          <label for="nueva-profesional">Profesional (opcional)</label>
          <select class="selector-combo" id="nueva-profesional" name="profesional_id"></select>
        </div>
        <div class="campo">
          <label for="nueva-fecha">Fecha</label>
          <input type="date" id="nueva-fecha" name="fecha">
        </div>
        <div class="campo">
          <label for="nueva-hora">Hora</label>
          <select class="selector-combo" id="nueva-hora" name="hora"></select>
        </div>
        <div class="campo">
          <button type="submit" class="btn-primary">Crear cita</button>
        </div>
      </form>

      <h2>Turnos disponibles</h2>
      <form class="filtros-turnos" id="form-disponibles" novalidate>
        <div class="campo">
          <label for="disp-sucursal">Sede</label>
          <select class="selector-combo" id="disp-sucursal" name="sucursal_id"></select>
        </div>
        <div class="campo">
          <label for="disp-fecha">Fecha</label>
          <input type="date" id="disp-fecha" name="fecha">
        </div>
        <div class="campo">
          <label for="disp-profesional">Profesional</label>
          <select class="selector-combo" id="disp-profesional" name="profesional_id"></select>
        </div>
        <div class="campo">
          <label for="disp-estudio">Estudio</label>
          <select class="selector-combo" id="disp-estudio" name="estudio"></select>
        </div>
      </form>
      <div id="disponibles-horas" class="horas-libres" aria-live="polite"></div>

      <h2>Citas</h2>
      <form class="filtros-turnos" id="filtros-turnos" novalidate>
        <div class="campo">
          <label for="filtro-desde">Desde</label>
          <input type="date" id="filtro-desde" name="desde">
        </div>
        <div class="campo">
          <label for="filtro-hasta">Hasta</label>
          <input type="date" id="filtro-hasta" name="hasta">
        </div>
        <div class="campo">
          <label for="filtro-sucursal">Sede</label>
          <select class="selector-combo" id="filtro-sucursal" name="sucursal_id">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-profesional">Profesional</label>
          <select class="selector-combo" id="filtro-profesional" name="profesional_id" data-buscable>
            <option value="">Todos</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-paciente">Paciente</label>
          <input type="search" id="filtro-paciente" name="paciente" placeholder="Nombre, apellido o CI" maxlength="80" autocomplete="off">
        </div>
        <div class="campo">
          <label for="filtro-estado">Estado</label>
          <select class="selector-combo" id="filtro-estado" name="estado">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="rechazada">Rechazada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-codigo">Código</label>
          <input type="text" id="filtro-codigo" name="codigo" placeholder="CI-000123" autocomplete="off">
        </div>
      </form>

      <p id="turnos-totales" role="status"></p>
      <p class="campo-hint" id="turnos-truncado" hidden>Se muestran las primeras 500 citas. Acotá el rango de fechas para ver el resto.</p>

      <div id="turnos-lista"></div>
    </section>
  </main>

  <footer>
    <p>&copy; Clínica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" defer></script>
  <script src="assets/js/campos.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
  <script src="assets/js/selector-combo.js" defer></script>
  <script src="assets/js/selector-fecha.js" defer></script>
  <script src="assets/js/turnos.js" defer></script>
</body>

</html>
