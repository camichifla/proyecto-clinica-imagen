#!/usr/sbin/nft -f
# /etc/nftables.conf — firewall for the Clinica Imagen server (replaces ufw).

# Start from a clean ruleset so re-loading is idempotent.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    # Loopback traffic is always trusted.
    iif "lo" accept

    # Drop invalid packets, accept replies to connections we initiated.
    ct state invalid drop
    ct state established,related accept

    # ICMP / ICMPv6 (ping, and IPv6 neighbour discovery which is required), rate limited.
    ip protocol icmp limit rate 10/second accept
    ip6 nexthdr icmpv6 limit rate 10/second accept

    # SSH: limit new connections per source IP (brute-force slowdown; fail2ban bans on top).
    tcp dport 22 ct state new meter ssh_rate { ip saddr limit rate 6/minute burst 5 packets } accept
    tcp dport 22 ct state new meter ssh_rate6 { ip6 saddr limit rate 6/minute burst 5 packets } accept

    # Web: 80 is always open (certbot HTTP-01 and the HTTP->HTTPS redirect), 443 for HTTPS.
    tcp dport { 80, 443 } accept
  }

  # This host is not a router.
  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  # Outbound traffic (apt, DNS, SMTP, rclone) is unrestricted.
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
