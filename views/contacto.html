<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - Clínica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/tema.js"></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clínica Imagen"></a>
    </div>
    <div class="user">
      <details class="menu-usuario" hidden>
        <summary class="menu-usuario-toggle" aria-label="Menú de usuario">
          <span class="avatar" aria-hidden="true"></span>
        </summary>
        <div class="menu-usuario-panel">
          <span class="user-nombre"></span>
          <ul class="menu-usuario-lista"></ul>
          <form method="post" action="logout.php" class="form-logout">
            <input type="hidden" name="csrf" value="">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
          </form>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-auth">
      <h1>Contacto</h1>
      <p>Escribinos y te respondemos a la brevedad. No hace falta tener una cuenta.</p>

      <div data-exito-panel hidden>
        <p class="aviso-exito" role="status">Gracias, recibimos tu mensaje. Nos pondremos en contacto con vos.</p>
        <p><a href="index.html" class="btn-primary">Volver al inicio</a></p>
      </div>

      <p class="campo-error" data-general role="alert" hidden></p>

      <form method="post" action="api/contacto.php" data-api="api/contacto.php" data-exito="[data-exito-panel]" novalidate>
        <input type="hidden" name="csrf" value="">

        <div class="campo-trampa" aria-hidden="true">
          <label for="sitio_web">No completar este campo</label>
          <input type="text" id="sitio_web" name="sitio_web" tabindex="-1" autocomplete="off">
        </div>

        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" maxlength="80" autocomplete="name" required>
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" maxlength="25" autocomplete="tel">
        </div>
        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="6" maxlength="2000" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; Clínica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" data-modo="publico" defer></script>
  <script src="assets/js/campos.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
</body>

</html>
