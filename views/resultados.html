<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados - Clínica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/tema.js"></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clínica Imagen"></a>
    </div>
    <div class="user">
      <details class="menu-usuario">
        <summary class="menu-usuario-toggle" aria-label="Menú de usuario">
          <span class="avatar" aria-hidden="true"></span>
        </summary>
        <div class="menu-usuario-panel">
          <span class="user-nombre"></span>
          <ul class="menu-usuario-lista"></ul>
          <form method="post" action="logout.php" class="form-logout">
            <input type="hidden" name="csrf" value="">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
          </form>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-panel">
      <h1 id="titulo-vista">Resultados</h1>

      <form method="get" action="resultados.html" class="form-buscar-paciente">
        <div class="campo">
          <label for="paciente_id_buscar">Paciente</label>
          <input type="text" id="paciente_id_buscar" data-lista="paciente_id_lista" data-buscador-combo="paciente_id"
                 data-mensaje-sin-pacientes="Todavia no hay pacientes registrados."
                 autocomplete="off" placeholder="Buscar por apellido, nombre o CI">
          <datalist id="paciente_id_lista"></datalist>
          <input type="hidden" id="paciente_id" name="paciente_id" value="">
        </div>

        <button type="submit" class="btn-primary" id="btn-buscar" disabled>Buscar</button>
      </form>
    </section>

    <div id="resultados-busqueda"></div>

    <dialog id="visor-imagen" class="visor-imagen">
      <button type="button" class="visor-imagen-cerrar" aria-label="Cerrar">&times;</button>
      <img src="" alt="">
    </dialog>

    <dialog id="visor-comparar" class="visor-imagen visor-comparar" aria-label="Comparacion de imágenes">
      <button type="button" class="visor-imagen-cerrar" aria-label="Cerrar comparacion">&times;</button>
      <div class="visor-comparar-grid"></div>
    </dialog>
  </main>

  <footer>
    <nav aria-label="Pie de página">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <p>&copy; Clínica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" defer></script>
  <script src="assets/js/selector-paciente-buscar.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
  <script src="assets/js/resultados-render.js" defer></script>
  <script src="assets/js/resultados-paciente.js" defer></script>
  <script src="assets/js/visor-imagenes.js" defer></script>
</body>

</html>
