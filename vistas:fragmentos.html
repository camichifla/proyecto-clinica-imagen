<!--
    Fragmento: formulario de solicitud de turno y modal de feedback.
    Uso:
    - Insertar este fragmento en la página donde se gestiona el turno.
    - El formulario tiene id `form-turno` que el JS usa para submit.
    - Los campos importantes:
        * `#sucursal`: select de sucursales (obligatorio).
        * `#estudio`: select dependiente de la sucursal seleccionada.
        * `#fecha_hora`: input tipo `datetime-local` para fecha/hora.
    - Los spans `#error-estudio` y `#error-fecha` muestran mensajes de error
        desde la validación en `main.js` o `app.js`.
    - El modal `#modal-feedback` muestra respuestas o errores del servidor.
-->
<form id="form-turno" class="form-dinamico">
    <div class="form-group">
        <label for="sucursal">Seleccione Sucursal:</label>
        <select id="sucursal" required>
            <option value="">-- Seleccione --</option>
            <option value="1">Sucursal Central</option>
            <option value="2">Sucursal Norte</option>
        </select>
    </div>

    <div class="form-group">
        <!-- Selector de estudio: normalmente se rellena dinámicamente
             cuando el usuario elige una sucursal. `required` evita enviar vacío. -->
        <label for="estudio">Tipo de Estudio:</label>
        <select id="estudio" required>
            <option value="">-- Seleccione Sucursal Primero --</option>
        </select>
        <!-- Contenedor para mensajes de validación relacionados con el estudio -->
        <span class="error-tooltip" id="error-estudio"></span>
    </div>

    <div class="form-group">
        <!-- Fecha/hora: input `datetime-local` usado por la validación en JS -->
        <label for="fecha_hora">Fecha y Hora de la Cita:</label>
        <input type="datetime-local" id="fecha_hora" required>
        <!-- Mensajes de error para la fecha (p. ej. fecha pasada) -->
        <span class="error-tooltip" id="error-fecha"></span>
    </div>

    <button type="submit" class="btn-primary">Confirmar Solicitud de Cita</button>
</form>

<!-- Modal de feedback: mostrar estado de la operación (éxito/error/proceso) -->
<div id="modal-feedback" class="modal hidden" aria-hidden="true" role="dialog">
    <div class="modal-content">
        <!-- Elementos con id usados por JS para actualizar título y mensaje -->
        <h3 id="modal-title">Procesando...</h3>
        <p id="modal-message">Su solicitud está siendo enviada al sistema.</p>
        <!-- Botón para cerrar el modal; el evento está en `main.js` -->
        <button id="btn-close-modal" class="btn-small">Entendido</button>
    </div>
</div>
