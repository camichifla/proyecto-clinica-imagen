<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar cita - Clínica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/tema.js"></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clínica Imagen"></a>
    </div>
    <div class="user">
      <details class="menu-usuario">
        <summary class="menu-usuario-toggle" aria-label="Menú de usuario">
          <span class="avatar" aria-hidden="true"></span>
        </summary>
        <div class="menu-usuario-panel">
          <span class="user-nombre"></span>
          <ul class="menu-usuario-lista"></ul>
          <form method="post" action="logout.php" class="form-logout">
            <input type="hidden" name="csrf" value="">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
          </form>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido">
    <div class="layout-agendar-citas">
      <section class="seccion-auth">
        <h1>Agendar cita</h1>

        <p class="aviso-exito" data-aviso="ok" hidden role="status">Solicitud enviada. <span data-codigo hidden>Código de seguimiento: <span data-codigo-valor></span>. </span>La clínica la va a confirmar y te avisamos por correo.</p>
        <p class="aviso-exito" data-aviso="cancelado" hidden role="status">La cita fue cancelada.</p>
        <p class="campo-error" data-general hidden></p>

        <form method="post" action="api/agendar-cita.php" data-api="api/agendar-cita.php" novalidate>
          <input type="hidden" name="csrf" value="">
          <input type="hidden" name="accion" value="crear">

          <div class="campo">
            <label for="estudio">Estudio</label>
            <select id="estudio" name="estudio" class="selector-combo" required>
              <option value="">Elegí un estudio</option>
            </select>
          </div>

          <div class="campo">
            <label for="sucursal">Sede</label>
            <select id="sucursal" name="sucursal_id" class="selector-combo" required>
              <option value="">Elegí una sede</option>
            </select>
          </div>

          <div class="campo">
            <label for="profesional_id">Profesional</label>
            <select id="profesional_id" name="profesional_id" class="selector-combo" required>
              <option value="">Elegí un profesional</option>
              <option value="cualquiera">Cualquier profesional</option>
            </select>
            <p class="campo-error" data-mensaje-sin-profesionales hidden>No hay profesionales cargados.</p>
          </div>

          <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>
          </div>

          <div class="campo">
            <label for="hora">Hora</label>
            <select id="hora" name="hora" class="selector-combo" disabled required>
              <option value="">Elegí sede y fecha primero</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Solicitar cita</button>
        </form>
      </section>

      <section class="seccion-panel">
        <h2>Mis citas</h2>
        <div id="mis-citas"></div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; Clínica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" defer></script>
  <script src="assets/js/campos.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
  <script src="assets/js/selector-fecha.js" defer></script>
  <script src="assets/js/agendar-cita.js" defer></script>
</body>

</html>
