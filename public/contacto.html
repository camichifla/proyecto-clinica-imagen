<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Clínica Imagen</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <header class="main-header shadow">
        <div class="container header-flex">
            <div class="logo">
                <a href="index.html">
                    <img src="./images/logo.png" alt="Clínica Imagen">
                </a>
            </div>
            <nav class="main-nav" aria-label="Navegación principal">
                <ul>
                    <li><a href="index.html#sucursales">Sucursales</a></li>
                    <li><a href="/clinica-imagen/api/paciente-dashboard.php" class="btn-nav">Portal Paciente</a></li>
                    <li><a href="contacto.html" class="btn-nav">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container contact-page-container">
        <h1 class="contact-title">¡Ponete en contacto con nosotros!</h1>
        
        <form id="form-contacto" action="../api/guardar_consulta.php" method="POST" class="contact-form">
            <div class="form-group contact-group">
                <label for="nombre">Nombre <span class="text-danger">*</span></label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group contact-group">
                <label for="correo">Correo <span class="text-danger">*</span></label>
                <input type="text" id="correo" name="correo" required>
            </div>

            <div class="form-group contact-group">
                <label for="Telefono">Teléfono <span class="text-danger">*</span></label>
                <input type="text" id="Telefono" name="Telefono" required>
            </div>
            
            <!-- Campo actualizado a 'consulta' -->
            <div class="form-group contact-group">
                <label for="consulta">Consulta o mensaje <span class="text-danger">*</span></label>
                <textarea id="consulta" name="consulta" rows="6" required></textarea>
            </div>
            
            <button type="submit" class="btn-nav btn-contacto">Enviar</button>
        </form>
    </main>

    <footer class="main-footer">
    </footer>

    <script src="scripts/contacto.js" defer></script>
</body>
</html>
