<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contrasena - Clinica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clinica Imagen"></a>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-auth">
      <h1>Restablecer contrasena</h1>

      <div data-token-invalido hidden>
        <p class="campo-error">El enlace de restablecimiento es invalido o vencio.</p>
        <p><a href="reset-request.html">Solicitar un nuevo enlace</a></p>
      </div>

      <p class="campo-error" data-general hidden></p>

      <form method="post" action="api/reset-confirm.php" data-api="api/reset-confirm.php" novalidate hidden>
        <input type="hidden" name="csrf" value="">
        <input type="hidden" name="token" value="">
        <div class="campo">
          <label for="contrasena">Nueva contrasena</label>
          <input type="password" id="contrasena" name="contrasena" required>
        </div>
        <button type="submit" class="btn-primary">Actualizar contrasena</button>
      </form>
    </section>
  </main>

  <footer>
    <nav aria-label="Pie de pagina">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <p>&copy; Clinica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" data-modo="publico" defer></script>
  <script src="assets/js/form-api.js" defer></script>
  <script src="assets/js/reset-confirm.js" defer></script>
</body>

</html>
