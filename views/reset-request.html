<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contrasena - Clinica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clinica Imagen"></a>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-auth">
      <h1>Recuperar contrasena</h1>

      <div data-exito-panel hidden>
        <p class="aviso-exito">Si el correo existe en el sistema, te enviamos un enlace para restablecer tu contrasena.</p>
        <p><a href="login.html">Volver a iniciar sesion</a></p>
      </div>

      <p class="campo-error" data-general hidden></p>

      <form method="post" action="api/reset-request.php" data-api="api/reset-request.php" data-exito="[data-exito-panel]" novalidate>
        <input type="hidden" name="csrf" value="">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn-primary">Enviar enlace</button>
      </form>
    </section>
  </main>

  <footer>
    <nav aria-label="Pie de pagina">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <p>&copy; Clinica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" data-modo="publico" defer></script>
  <script src="assets/js/form-api.js" defer></script>
</body>

</html>
