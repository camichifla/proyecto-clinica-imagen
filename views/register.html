<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - Clínica Imagen</title>
  <link rel="icon" type="image/png" href="./assets/imagenes/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/tema.js"></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="logo">
      <a href="index.html"><img src="./assets/imagenes/logo.png" alt="Clínica Imagen"></a>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion-auth">
      <h1>Crear cuenta</h1>

      <div data-exito-panel hidden>
        <p class="aviso-exito" role="status">Revisá tu correo para verificar tu cuenta antes de iniciar sesión.</p>
        <p><a href="login.html" class="btn-primary">Ir a iniciar sesión</a></p>
      </div>

      <p class="campo-error" data-general hidden></p>

      <form method="post" action="api/register.php" data-api="api/register.php" data-exito="[data-exito-panel]" novalidate>
        <input type="hidden" name="csrf" value="">

        <div class="campo-fila">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required pattern="\p{L}[\p{L}\s'\-]{1,59}" maxlength="60" data-permitidos="\p{L}\s'\-">
          </div>
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required pattern="\p{L}[\p{L}\s'\-]{1,59}" maxlength="60" data-permitidos="\p{L}\s'\-">
          </div>
        </div>

        <div class="campo">
          <label for="ci">Cédula</label>
          <input type="text" id="ci" name="ci" required pattern="\d{7,8}" inputmode="numeric" maxlength="8" data-permitidos="\d" placeholder="12345678">
        </div>
        <div class="campo">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" required minlength="5" maxlength="160" placeholder="Av. Italia 1234">
        </div>
        <div class="campo">
          <label for="numero">Teléfono</label>
          <input type="tel" id="numero" name="numero" required pattern="\+?\d[\d\s\-]{7,24}" maxlength="25" data-permitidos="\d\s+\-" placeholder="099123456">
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required placeholder="nombre@dominio.com">
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required pattern="(?=.*\p{L})(?=.*\d)(?=.*[^\p{L}\d\s]).{8,72}" maxlength="72" value="" aria-describedby="requisitos-contrasena">
          <ul class="requisitos" id="requisitos-contrasena" data-para="contrasena">
            <li data-regla=".{8,}">Mínimo 8 caracteres</li>
            <li data-regla="\p{L}">Al menos una letra</li>
            <li data-regla="\d">Al menos un número</li>
            <li data-regla="[^\p{L}\d\s]">Al menos un carácter especial (!, ?, #, ...)</li>
          </ul>
        </div>

        <button type="submit" class="btn-primary">Registrarme</button>
      </form>

      <p>¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; Clínica Imagen</p>
  </footer>

  <script src="assets/js/sesion.js" data-modo="publico" defer></script>
  <script src="assets/js/campos.js" defer></script>
  <script src="assets/js/form-api.js" defer></script>
</body>

</html>
